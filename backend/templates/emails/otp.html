<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #f8fafc;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color: #1e293b;
  }
  .container {
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    padding: 60px 20px;
  }
  .card {
    background: #ffffff;
    border-radius: 16px;
    padding: 40px;
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
    border: 1px solid #e2e8f0;
  }
  .header {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 16px;
    color: #0f172a;
    letter-spacing: -0.025em;
  }
  .content {
    font-size: 16px;
    line-height: 1.6;
    margin-bottom: 32px;
    color: #475569;
  }
  .otp-box {
    background: #f1f5f9;
    color: #0f172a;
    padding: 32px;
    text-align: center;
    font-size: 42px;
    font-weight: 800;
    letter-spacing: 12px;
    margin-bottom: 32px;
    border-radius: 12px;
    font-family: 'Courier New', Courier, monospace;
    border: 1px solid #e2e8f0;
  }
  .footer {
    margin-top: 40px;
    padding-top: 24px;
    border-top: 1px solid #e2e8f0;
    font-size: 13px;
    color: #94a3b8;
    line-height: 1.6;
  }
  .brand {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.025em;
    margin-bottom: 32px;
    color: #000000;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="brand">STAPLATE</div>
    <div class="card">
      <div class="header">Hey {{ name|default:"there" }},</div>
      <div class="content">
        Use the following one-time authentication code to sign in to your Staplate account.
      </div>
      
      <div class="otp-box">
        {{ otp }}
      </div>
      
      <div class="footer">
        <strong>Security Notice:</strong> This code is valid for 10 minutes and can only be used once. If you didn't request this, you can safely ignore this email.
      </div>
    </div>
  </div>
</body>
</html>
